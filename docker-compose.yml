version: '3.8'

services:
  # 1. Database PostgreSQL (GIS-Ready)
  postgres:
    image: postgres:15-alpine
    container_name: psc-postgres
    restart: always
    environment:
      POSTGRES_USER: psc_user
      POSTGRES_PASSWORD: psc_password
      POSTGRES_DB: psc_db
    command: postgres -c max_connections=100 -c shared_buffers=128MB -c work_mem=8MB -c maintenance_work_mem=32MB
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/trashcare.sql:/docker-entrypoint-initdb.d/trashcare.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psc_user -d psc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: psc-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Express Backend API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: psc-backend
    restart: always
    ports:
      - '3001:3000'
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://psc_user:psc_password@postgres:5432/psc_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=ganti_ini_dengan_string_random_minimal_32_karakter
      - JWT_EXPIRES_IN=24h
      - PORT=3000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:5174
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. React Frontend Web
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: psc-frontend
    restart: always
    ports:
      - '5174:5173'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:3001/api/v1
    depends_on:
      - api


