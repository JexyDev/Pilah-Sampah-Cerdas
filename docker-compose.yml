version: '3.8'

services:
  # 1. Database PostgreSQL (GIS-Ready)
  postgres:
    image: postgres:15-alpine
    container_name: psc-postgres
    restart: always
    environment:
      POSTGRES_USER: psc_user
      POSTGRES_PASSWORD: psc_password
      POSTGRES_DB: psc_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psc_user -d psc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: psc-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. AI Model Serving (YOLOv8-seg -> ONNX, FastAPI)
  # Resource-limited per implementation_plan.md §6.5 — VPS has very little
  # RAM headroom, so this container must not exceed these caps.
  ai-model:
    build:
      context: ../model
      dockerfile: serving/Dockerfile
    container_name: psc-ai-model
    restart: always
    ports:
      - '8000:8000'
    mem_limit: 700m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
