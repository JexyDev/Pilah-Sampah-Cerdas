name: mobile_app_sampah
description: Aplikasi Mobile Warga - BERSEKA
publish_to: 'none'
version: 1.1.0+111

environment:
  # sdd.md §12 menetapkan Dart 3.12.2 — dilonggarkan ke >=3.12.1 untuk kompatibilitas
  # patch version lokal (3.12.1). Ganti ke >=3.12.2 saat SDK diupdate.
  sdk: '>=3.12.1 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # HTTP Client (dikunci per sdd.md §12 — sementara tidak dipakai, disiapkan untuk integrasi BE)
  dio: ^5.11.0

  # QR Scanner
  mobile_scanner: ^6.0.10

  # Camera — kamera inline di dalam app (tidak keluar ke sistem kamera)
  camera: ^0.11.0+2

  # Image Picker — untuk galeri dan fallback
  image_picker: ^1.1.2

  # Image Compression
  flutter_image_compress: ^2.3.0

  # GPS / Geolocation / Maps
  geolocator: ^13.0.4
  flutter_foreground_task: ^8.13.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Secure Token Storage
  flutter_secure_storage: ^9.2.4

  # Push Notification
  firebase_messaging: ^15.2.5

  # Connectivity Monitor
  connectivity_plus: ^6.1.4

  # Local Cache
  shared_preferences: ^2.5.5
  # Google Fonts (Poppins)
  google_fonts: ^6.2.1

  # Icons
  flutter_svg: ^2.0.10+1

  # Utility
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  
  # QR and PDF Export
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.0
  path_provider: ^2.1.3
  share_plus: ^10.1.0
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  lottie: ^3.5.1
  http_parser: ^4.1.2

  path: any
  cached_network_image: ^3.4.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  file_picker: ^11.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

  http: any
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true

  assets:
    - assets/logo_berseka.webp
    - assets/app-logo.png
    - assets/app-icon.png
    - assets/icons/
    - assets/images/
