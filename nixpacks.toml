# Nixpacks config for Railway — pilahsampah.id backend
# Build TypeScript → dist/ sebelum deploy

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --production=false"]

[phases.build]
cmds = [
  "npm run build",
  "npx prisma generate"
]

[start]
cmd = "npx prisma migrate deploy && node dist/index.js"
