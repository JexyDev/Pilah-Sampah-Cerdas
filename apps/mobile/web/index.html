<!DOCTYPE html><html lang="id"><head>
  <!--
    Pilah Sampah Cerdas — Web Platform
    pilahsampah.id | Kecamatan Coblong, Kota Bandung
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pilah Sampah Cerdas — Platform cerdas manajemen pemilahan sampah berbasis AI, Kecamatan Coblong, Kota Bandung.">
  <meta name="theme-color" content="#ffffff">

  <!-- Viewport responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pilah Sampah Cerdas">

  <!-- PWA -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Pilah Sampah Cerdas</title>

  <style>
    /* Loading screen sesuai desain splash — putih bersih */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }
    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0 40px;
      width: 100%;
      max-width: 400px;
    }
    #loading-screen h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0056A4;
      margin-bottom: 8px;
      letter-spacing: 0;
    }
    #loading-screen p {
      font-size: 0.875rem;
      color: #2E7D32;
      font-weight: 600;
    }
    /* Dot indicator */
    .dots {
      position: fixed;
      bottom: 48px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .dot {
      height: 8px;
      border-radius: 4px;
      background-color: #CDD5E0;
      width: 8px;
    }
    .dot.active {
      background-color: #0056A4;
      width: 22px;
    }
  </style>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <div id="loading-screen">
    <h1>Pilah Sampah Cerdas</h1>
    <p>Sampah Terdata,&nbsp; Lingkungan Tertata</p>
  </div>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-screen');
      var dots = document.querySelector('.dots');
      if (el) el.remove();
      if (dots) dots.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
