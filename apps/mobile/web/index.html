<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    Pilah Sampah Cerdas — Web Platform
    pilahsampah.id | Kecamatan Coblong, Kota Bandung
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pilah Sampah Cerdas — Platform cerdas manajemen pemilahan sampah berbasis AI, Kecamatan Coblong, Kota Bandung.">
  <meta name="theme-color" content="#ffffff">

  <!-- Viewport responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pilah Sampah Cerdas">

  <!-- PWA -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Pilah Sampah Cerdas</title>

  <style>
    /* Loading screen sesuai desain splash — putih bersih */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }
    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0 40px;
      width: 100%;
      max-width: 400px;
    }
    #loading-screen h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0056A4;
      margin-bottom: 8px;
      letter-spacing: 0;
    }
    #loading-screen p {
      font-size: 0.875rem;
      color: #2E7D32;
      font-weight: 600;
    }
    /* Dot indicator */
    .dots {
      position: fixed;
      bottom: 48px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .dot {
      height: 8px;
      border-radius: 4px;
      background-color: #CDD5E0;
      width: 8px;
    }
    .dot.active {
      background-color: #0056A4;
      width: 22px;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <h1>Pilah Sampah Cerdas</h1>
    <p>Sampah Terdata,&nbsp; Lingkungan Tertata</p>
  </div>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-screen');
      var dots = document.querySelector('.dots');
      if (el) el.remove();
      if (dots) dots.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
