<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>
  
  <g transform="translate(300, 160)" text-anchor="middle" filter="url(#shadow)">
    <!-- Rounded icon card -->
    <rect x="-48" y="-48" width="96" height="96" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Image placeholder icon -->
    <g transform="translate(-24, -24)" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="42" height="42" rx="6"/>
      <circle cx="16" cy="16" r="4" fill="#94a3b8" stroke="none"/>
      <path d="m45 33-11-11a3 3 0 0 0-4 0l-15 15"/>
      <path d="m27 27 3-3a3 3 0 0 1 4 0l11 11"/>
    </g>
  </g>

  <!-- Clean typography -->
  <text x="300" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#334155">
    Foto Dokumentasi
  </text>
  <text x="300" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Berkas arsip tidak tersedia di server
  </text>
  <text x="300" y="306" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#10b981">
    BERSEKA &bull; PILAH SAMPAH CERDAS
  </text>
</svg>
