</div>
</div>
<!-- Password Field -->

<label class="font-label-md text-label-md text-on-surface-variant mb-stack-sm font-medium" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">

<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-outline hover:text-on-surface transition-colors" onclick="const p=document.getElementById('password'); const i=this.querySelector('span'); if(p.type==='password'){p.type='text';i.textContent='visibility_off';}else{p.type='password';i.textContent='visibility';}" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>

<option value="petugas_rt">Petugas RT</option>
