name: Deploy to VPS

on:
  push:
    branches:
      - local-dev
      - backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ~/Pilah-Sampah-Cerdas
            git pull origin local-dev
            npm install
            npm run build
            pm2 restart all
