name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ~/Pilah-Sampah-Cerdas
            git fetch origin main
            git reset --hard origin/main

            # Backend
            cd apps/api
            npm install
            npm run build
            npx prisma generate
            npx prisma migrate deploy
            cd ../..

            # Frontend (Zero-Downtime Atomic Deployment)
            cd apps/web
            npm install
            npx vite build --outDir dist-temp
            rm -rf dist-old
            mv dist dist-old 2>/dev/null || true
            mv dist-temp dist
            rm -rf dist-old
            cd ../..

            # Restart services
            pm2 restart all
