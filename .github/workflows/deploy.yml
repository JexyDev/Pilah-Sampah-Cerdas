name: BERSEKA Mobile — CI/CD Pipeline

on:
  push:
    branches:
      - mobile
      - fix-analyze-and-dummy-v2
  pull_request:
    branches:
      - mobile

jobs:
  validate:
    name: Validate Code & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Analysis (Strict Linter)
        run: flutter analyze --no-fatal-warnings

      - name: Run Unit Tests
        run: flutter test
