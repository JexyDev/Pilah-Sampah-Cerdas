name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Web (GitHub Actions)
        run: |
          cd apps/web
          npm install --silent
          npm run build
          test -f dist/index.html || { echo "Build failed: dist/index.html missing"; exit 1; }

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy Backend & Prepare VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" ssh -T -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o PreferredAuthentications=password -o PubkeyAuthentication=no "$VPS_USER@$VPS_HOST" "VPS_PASS='$VPS_PASS' bash -s" << 'EOF'
            export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            echo "=== 1. Pulling Latest Code from Git ==="
            cd ~/Pilah-Sampah-Cerdas-new || cd ~/Pilah-Sampah-Cerdas || { echo "Directory not found"; exit 1; }
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2. Updating Backend (apps/api) ==="
            cd apps/api
            npm install --silent
            npx prisma generate
            npx prisma db push --skip-generate --accept-data-loss
            npx prisma db seed
            npx tsx scripts/seed-complete-master-data.ts || true
            npx tsx scripts/sync-nims-now.ts || true
            npm run build

            echo "=== 3. Restarting PM2 Backend ==="
            pm2 delete psc-backend 2>/dev/null || true
            pm2 start dist/index.js --name psc-backend
            pm2 save || true

            echo "=== 4. Preparing Frontend Web Root ==="
            echo "$VPS_PASS" | sudo -S mkdir -p /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist /tmp/frontend-dist
            mkdir -p ~/Pilah-Sampah-Cerdas/apps/web/dist ~/Pilah-Sampah-Cerdas-new/apps/web/dist 2>/dev/null || true
            echo "$VPS_PASS" | sudo -S rm -rf /var/www/html/assets /var/www/pilah-sampah-cerdas/frontend/dist/assets /tmp/frontend-dist/*
            rm -rf ~/Pilah-Sampah-Cerdas/apps/web/dist/assets ~/Pilah-Sampah-Cerdas-new/apps/web/dist/assets 2>/dev/null || true
            echo "$VPS_PASS" | sudo -S chown -R $USER:$USER /tmp/frontend-dist
          EOF

      - name: Upload Frontend Dist to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no -r apps/web/dist/* "$VPS_USER@$VPS_HOST":/tmp/frontend-dist/
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "test -f /tmp/frontend-dist/index.html" || { echo "SCP Upload failed"; exit 1; }

      - name: Finalize Web Deployment & Fix Permissions
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" ssh -T -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "VPS_PASS='$VPS_PASS' bash -s" << 'EOF'
            echo "=== 5. Moving Uploaded Files to Web Root ==="
            echo "$VPS_PASS" | sudo -S cp -r /tmp/frontend-dist/* /var/www/html/
            echo "$VPS_PASS" | sudo -S cp -r /tmp/frontend-dist/* /var/www/pilah-sampah-cerdas/frontend/dist/
            cp -r /tmp/frontend-dist/* ~/Pilah-Sampah-Cerdas/apps/web/dist/ 2>/dev/null || true
            cp -r /tmp/frontend-dist/* ~/Pilah-Sampah-Cerdas-new/apps/web/dist/ 2>/dev/null || true
            echo "$VPS_PASS" | sudo -S rm -rf /tmp/frontend-dist

            echo "=== 6. Fixing Permissions & Ownership ==="
            echo "$VPS_PASS" | sudo -S chown -R www-data:www-data /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist 2>/dev/null || echo "$VPS_PASS" | sudo -S chown -R $USER:$USER /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist
            echo "$VPS_PASS" | sudo -S chmod -R 755 /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist
            chmod -R 755 ~/Pilah-Sampah-Cerdas/apps/web/dist ~/Pilah-Sampah-Cerdas-new/apps/web/dist 2>/dev/null || true

            echo "=== 7. Reload Nginx ==="
            echo "$VPS_PASS" | sudo -S systemctl reload nginx || true

            echo "=== 8. Verification & PM2 Status ==="
            test -f /var/www/html/index.html && echo "Deployment verified: /var/www/html/index.html exists"
            export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            pm2 status || true
          EOF


