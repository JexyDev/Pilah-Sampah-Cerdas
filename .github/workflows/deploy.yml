name: BERSEKA Mobile — CI/CD Pipeline

on:
  push:
    branches:
      - mobile
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scratch/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - mobile
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scratch/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  validate:
    name: Validate Code & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Analysis (Strict Linter)
        run: flutter analyze --no-fatal-warnings

      - name: Run Unit Tests
        run: flutter test

  build-and-deploy-apk:
    name: Build Release APK & Deploy to Web Download Page
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Mobile Code
        uses: actions/checkout@v4

      - name: Determine Target Environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target_env }}"
          else
            TARGET="production"
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          if [ "$TARGET" = "staging" ]; then
            echo "api_base=https://staging.berseka.id" >> $GITHUB_OUTPUT
            echo "apk_name=berseka-staging-arm64-v8a.apk" >> $GITHUB_OUTPUT
            echo "dest_dir=/var/www/staging-web/dist/downloads" >> $GITHUB_OUTPUT
          else
            echo "api_base=https://berseka.id" >> $GITHUB_OUTPUT
            echo "apk_name=berseka-release-arm64-v8a.apk" >> $GITHUB_OUTPUT
            echo "dest_dir=/var/www/html/downloads" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CMake 3.22.1 via Android SDK Manager
        run: |
          SDK_MANAGER=$(find $ANDROID_HOME -name "sdkmanager" | grep "latest" | head -n 1)
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find $ANDROID_HOME -name "sdkmanager" | head -n 1)
          fi
          echo "Found sdkmanager at: $SDK_MANAGER"
          yes | $SDK_MANAGER --licenses || true
          $SDK_MANAGER "cmake;3.22.1"

      - name: Setup CI Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using persistent keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/berseka-release.keystore
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=berseka-release.keystore" >> android/key.properties
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not set."
            echo "Generating temporary keystore — APK tidak bisa update app yang sudah terinstall!"
            keytool -genkey -v -keystore android/app/berseka-release.keystore \
              -alias bersekakey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass bersekarelease2026 -keypass bersekarelease2026 \
              -dname "CN=BERSEKA CI, OU=Engineering, O=UNIKOM, L=Bandung, ST=Jawa Barat, C=ID"
            echo "storePassword=bersekarelease2026" > android/key.properties
            echo "keyPassword=bersekarelease2026" >> android/key.properties
            echo "keyAlias=bersekakey" >> android/key.properties
            echo "storeFile=berseka-release.keystore" >> android/key.properties
          fi

      - name: Generate Dynamic Semantic Version
        run: |
          BASE_VERSION="1.1"
          OFFSET=1264
          PATCH_NUM=$((${{ github.run_number }} - OFFSET))
          if [ $PATCH_NUM -lt 0 ]; then PATCH_NUM=0; fi
          VERSION_NAME="$BASE_VERSION.$PATCH_NUM"
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.set-env.outputs.api_base }} \
            --build-name=${{ env.APP_VERSION }} \
            --build-number=${{ github.run_number }} \
            --android-skip-build-dependency-validation
          ls -lah build/app/outputs/flutter-apk/

      - name: Bypass MTU Blackhole (Fix Hang Issue)
        run: |
          echo "Current MTU settings:"
          ip link show
          DEFAULT_IF=$(ip route | grep default | awk '{print $5}')
          if [ -n "$DEFAULT_IF" ]; then
            echo "Default interface is $DEFAULT_IF. Lowering MTU to 1360 to bypass IDCloudHost firewall issues..."
            sudo ip link set dev $DEFAULT_IF mtu 1360
            ip link show $DEFAULT_IF
          else
            echo "Warning: Could not determine default interface."
          fi

      - name: Prepare VPS Credentials and Target APK
        id: vps-creds
        run: |
          if [ "${{ steps.set-env.outputs.target }}" = "staging" ]; then
            echo "host=${{ secrets.STAGING_VPS_HOST }}" >> $GITHUB_OUTPUT
            echo "user=${{ secrets.STAGING_VPS_USERNAME }}" >> $GITHUB_OUTPUT
            echo "pass=${{ secrets.STAGING_VPS_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.VPS_HOST }}" >> $GITHUB_OUTPUT
            echo "user=${{ secrets.VPS_USERNAME }}" >> $GITHUB_OUTPUT
            echo "pass=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_OUTPUT
          fi
          
          # Prepare the APK file to upload
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find build/app/outputs/flutter-apk/ -name "*.apk" | head -n 1)
          fi
          
          # Rename it locally so appleboy/scp-action uploads it directly with the correct name
          APK_NAME="${{ steps.set-env.outputs.apk_name }}"
          cp "$APK_FILE" "$APK_NAME"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK via SFTP (Reliable Action)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.vps-creds.outputs.host }}
          username: ${{ steps.vps-creds.outputs.user }}
          password: ${{ steps.vps-creds.outputs.pass }}
          source: ${{ steps.vps-creds.outputs.apk_name }}
          target: "/tmp"
          timeout: "5m"
          overwrite: true

      - name: Execute Remote Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        env:
          APK_NAME: ${{ steps.set-env.outputs.apk_name }}
          DEST_DIR: ${{ steps.set-env.outputs.dest_dir }}
          APP_VERSION: ${{ env.APP_VERSION }}
          RUN_NUMBER: ${{ github.run_number }}
          VPS_PASS: ${{ steps.vps-creds.outputs.pass }}
        with:
          host: ${{ steps.vps-creds.outputs.host }}
          username: ${{ steps.vps-creds.outputs.user }}
          password: ${{ steps.vps-creds.outputs.pass }}
          envs: APK_NAME,DEST_DIR,APP_VERSION,RUN_NUMBER,VPS_PASS
          script: |
            set -e
            TMP_APK="/tmp/$APK_NAME"
            
            if [ ! -f "$TMP_APK" ]; then
              echo "Error: APK file not found at $TMP_APK"
              exit 1
            fi

            echo "=== Deploying APK to $DEST_DIR ==="
            echo "$VPS_PASS" | sudo -S mkdir -p "$DEST_DIR"
            echo "$VPS_PASS" | sudo -S cp "$TMP_APK" "$DEST_DIR/$APK_NAME"
            echo "$VPS_PASS" | sudo -S chmod 644 "$DEST_DIR/$APK_NAME"
            rm -f "$TMP_APK"
            echo "APK successfully published to $DEST_DIR/$APK_NAME"
            ls -lh "$DEST_DIR/$APK_NAME"

            echo "=== Updating Release Metadata in Database API ==="
            FILE_SIZE=$(stat -c%s "$DEST_DIR/$APK_NAME" 2>/dev/null || echo "0")
            FORMATTED_SIZE=$(numfmt --to=iec-i --suffix=B --format="%.2f" $FILE_SIZE 2>/dev/null || echo "")
            if [ -z "$FORMATTED_SIZE" ]; then
              FORMATTED_SIZE=$(awk -v size="$FILE_SIZE" 'BEGIN { printf "%.2f MB", size / 1048576 }')
            fi

            curl -s -X POST "http://localhost:3000/api/v1/system/publish-release" \
              -H "Content-Type: application/json" \
              -H "x-ci-secret: berseka-ci-secret" \
              -d "{
                \"latestVersion\": \"$APP_VERSION\",
                \"version\": \"$APP_VERSION\",
                \"buildNumber\": $RUN_NUMBER,
                \"releaseNotes\": \"Auto-build CI/CD universal APK v$APP_VERSION (Build $RUN_NUMBER), pembaruan performa, dan sinkronisasi real-time.\",
                \"downloadUrl\": \"/downloads/$APK_NAME\",
                \"apkUrl\": \"/downloads/$APK_NAME\",
                \"fileSizeBytes\": $FILE_SIZE,
                \"formattedSize\": \"$FORMATTED_SIZE\",
                \"forceUpdate\": false
              }" || echo "Warning: Failed to notify backend API of new release"

            echo "=== Mobile APK Release Sync Completed ==="
