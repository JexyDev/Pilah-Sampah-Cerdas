name: BERSEKA Mobile — CI/CD Pipeline

on:
  push:
    branches:
      - mobile
  pull_request:
    branches:
      - mobile

jobs:
  validate:
    name: Validate Code & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Analysis (Strict Linter)
        run: flutter analyze --no-fatal-warnings

      - name: Run Unit Tests
        run: flutter test

  build-and-deploy-apk:
    name: Build Release APK & Deploy to Web Download Page
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/mobile'

    steps:
      - name: Checkout Mobile Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CMake 3.22.1 via Android SDK Manager
        run: |
          SDK_MANAGER=$(find $ANDROID_HOME -name "sdkmanager" | grep "latest" | head -n 1)
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find $ANDROID_HOME -name "sdkmanager" | head -n 1)
          fi
          echo "Found sdkmanager at: $SDK_MANAGER"
          yes | $SDK_MANAGER --licenses || true
          $SDK_MANAGER "cmake;3.22.1"

      - name: Build Android Release APK (Universal Build)
        run: |
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          ls -lah build/app/outputs/flutter-apk/

      - name: Install sshpass
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass

      - name: Deploy APK to VPS & Update Web Download Page
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
          CI_SECRET: ${{ secrets.CI_SECRET || 'berseka-ci-secret' }}
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find build/app/outputs/flutter-apk/ -name "*.apk" | head -n 1)
          fi

          echo "Uploading $APK_FILE to VPS..."
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no "$APK_FILE" "$VPS_USER@$VPS_HOST:berseka-release-arm64-v8a.apk"

          sshpass -p "$VPS_PASS" ssh -T -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "VPS_PASS='$VPS_PASS' CI_SECRET='$CI_SECRET' bash -s" << 'EOF'
            set -e
            TMP_APK="$HOME/berseka-release-arm64-v8a.apk"
            echo "=== 1. Deploying APK to Nginx Static & API Downloads ==="
            echo "$VPS_PASS" | sudo -S mkdir -p /var/www/html/downloads /var/www/pilah-sampah-cerdas/frontend/dist/downloads /home/maker/Pilah-Sampah-Cerdas/apps/api/uploads

            echo "$VPS_PASS" | sudo -S cp "$TMP_APK" /var/www/html/downloads/berseka-release-arm64-v8a.apk
            echo "$VPS_PASS" | sudo -S cp "$TMP_APK" /var/www/pilah-sampah-cerdas/frontend/dist/downloads/berseka-release-arm64-v8a.apk
            echo "$VPS_PASS" | sudo -S cp "$TMP_APK" /home/maker/Pilah-Sampah-Cerdas/apps/api/uploads/berseka-release-arm64-v8a.apk

            echo "$VPS_PASS" | sudo -S chown -R www-data:www-data /var/www/html/downloads
            echo "$VPS_PASS" | sudo -S chmod 644 /var/www/html/downloads/berseka-release-arm64-v8a.apk
            rm -f "$TMP_APK"

            echo "=== 2. Updating Release Info in Database API ==="
            FILE_SIZE=$(stat -c%s "/home/maker/Pilah-Sampah-Cerdas/apps/api/uploads/berseka-release-arm64-v8a.apk" 2>/dev/null || echo "26004512")
            
            curl -s -X POST "http://localhost:3000/api/v1/system/publish-release" \
              -H "Content-Type: application/json" \
              -H "x-ci-secret: $CI_SECRET" \
              -d "{
                \"latestVersion\": \"1.0.${{ github.run_number }}\",
                \"version\": \"1.0.${{ github.run_number }}\",
                \"buildNumber\": ${{ github.run_number }},
                \"releaseNotes\": \"Auto-build CI/CD universal APK v1.0.${{ github.run_number }} (Build ${{ github.run_number }}), pembaruan performa, dan sinkronisasi real-time.\",
                \"downloadUrl\": \"/downloads/berseka-release-arm64-v8a.apk\",
                \"apkUrl\": \"/downloads/berseka-release-arm64-v8a.apk\",
                \"fileSizeBytes\": $FILE_SIZE,
                \"forceUpdate\": false
              }" || echo "Publish release notification sent"

            echo "=== Mobile APK CI/CD Deployment Successfully Completed! ==="
          EOF
