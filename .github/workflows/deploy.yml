name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build & Package Frontend Web (GitHub Actions)
        run: |
          cd apps/web
          npm ci --prefer-offline --no-audit || npm install --silent --legacy-peer-deps
          npm run build
          test -f dist/index.html || { echo "Build failed: dist/index.html missing"; exit 1; }
          cd dist && tar -czf ../dist.tar.gz *

      - name: Install sshpass
        timeout-minutes: 2
        run: |
          if ! command -v sshpass &> /dev/null; then
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sshpass
          fi

      - name: Upload Frontend Archive to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IPQoS=throughput apps/web/dist.tar.gz "$VPS_USER@$VPS_HOST":/tmp/frontend-dist.tar.gz

      - name: Update Backend & Deploy Web on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" ssh -T -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o PreferredAuthentications=password -o PubkeyAuthentication=no "$VPS_USER@$VPS_HOST" "VPS_PASS='$VPS_PASS' bash -s" << 'EOF'
            set -e
            NODE_BIN_DIR=$(ls -d ~/.nvm/versions/node/v* 2>/dev/null | tail -n 1)/bin
            export PATH=$PATH:/usr/local/bin:$NODE_BIN_DIR
            PM2_BIN="$NODE_BIN_DIR/pm2"
            if ! command -v "$PM2_BIN" &> /dev/null; then PM2_BIN="pm2"; fi
            
            echo "=== 1. Pulling Latest Code from Git ==="
            if [ -d ~/Pilah-Sampah-Cerdas-new ]; then REPO_DIR=~/Pilah-Sampah-Cerdas-new; else REPO_DIR=~/Pilah-Sampah-Cerdas; fi
            cd "$REPO_DIR" || { echo "Directory not found"; exit 1; }
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2. Updating Backend (apps/api) ==="
            cd apps/api

            # Optimasi PostgreSQL max_connections di Docker Container VPS (1000 koneksi)
            echo "$VPS_PASS" | sudo -S docker exec psc-postgres sh -c "echo 'max_connections = 1000' >> /var/lib/postgresql/data/postgresql.conf && echo 'shared_buffers = 512MB' >> /var/lib/postgresql/data/postgresql.conf" 2>/dev/null || true
            echo "$VPS_PASS" | sudo -S docker restart psc-postgres 2>/dev/null || true
            sleep 3

            npm install --silent --legacy-peer-deps || npm install --legacy-peer-deps
            npx prisma generate

            # Baseline migration lama agar prisma migrate deploy tidak error P3005.
            # migrate resolve --applied hanya mencatat nama ke tabel _prisma_migrations,
            # tidak menjalankan SQL apapun. Aman diulang (idempotent).
            echo "==> Baseline migration lama ke _prisma_migrations..."
            npx prisma migrate resolve --applied "20260711142358_init_all"              2>/dev/null || true
            npx prisma migrate resolve --applied "20260711143430_bin_coordinates"       2>/dev/null || true
            npx prisma migrate resolve --applied "20260721071914_add_violations"        2>/dev/null || true
            npx prisma migrate resolve --applied "20260721130000_extend_schema_for_8_roles" 2>/dev/null || true
            npx prisma migrate resolve --applied "20260721140000_refactor_bin_ownerships"   2>/dev/null || true
            npx prisma migrate resolve --applied "20260721150000_extend_schema_for_batch_2" 2>/dev/null || true
            npx prisma migrate resolve --applied "20260721160000_add_peternakan_and_maggot_distributions" 2>/dev/null || true
            npx prisma migrate resolve --applied "20260722045006_rw_portal_fields"      2>/dev/null || true
            npx prisma migrate resolve --applied "20260723034830_rename_tables_to_indonesian" 2>/dev/null || true
            npx prisma migrate resolve --applied "20260723040353_sync_db"               2>/dev/null || true
            npx prisma migrate resolve --applied "20260812083011_add_survei_kkn_tables" 2>/dev/null || true
            npx prisma migrate resolve --applied "20260812100524_add_evaluasi_dampak_kkn" 2>/dev/null || true
            # Reset status jika migrasi sempat gagal sebelumnya agar dapat diaplikasikan ulang
            npx prisma migrate resolve --rolled-back "20260815_add_petugas_tetap_jenis_sampah" 2>/dev/null || true
            echo "==> Baseline selesai. Menjalankan migrate deploy..."

            npx prisma migrate deploy || true
            npm run build

            echo "=== 3. Restarting PM2 Backend ==="
            $PM2_BIN delete psc-backend 2>/dev/null || true
            $PM2_BIN start dist/index.js --name psc-backend --cwd "$REPO_DIR/apps/api"
            $PM2_BIN save || true
            sleep 2
            $PM2_BIN status psc-backend

            echo "=== 4. Deploying Frontend Web to Nginx ==="
            echo "$VPS_PASS" | sudo -S mkdir -p /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist
            mkdir -p "$REPO_DIR/apps/web/dist"

            if [ -f /tmp/frontend-dist.tar.gz ] && tar -tzf /tmp/frontend-dist.tar.gz &>/dev/null; then
              echo "Extracting frontend archive from GitHub Actions..."
              tar -xzf /tmp/frontend-dist.tar.gz -C "$REPO_DIR/apps/web/dist/"
              rm -f /tmp/frontend-dist.tar.gz
            else
              echo "Frontend archive corrupted or missing, building web frontend directly on VPS..."
              cd "$REPO_DIR"
              npm run install:web || (cd apps/web && npm install --legacy-peer-deps)
              npm run build:web
            fi

            test -f "$REPO_DIR/apps/web/dist/index.html" || { echo "Frontend build missing index.html"; exit 1; }

            echo "$VPS_PASS" | sudo -S rm -rf /var/www/html/* /var/www/pilah-sampah-cerdas/frontend/dist/*
            echo "$VPS_PASS" | sudo -S cp -r "$REPO_DIR/apps/web/dist"/* /var/www/html/
            echo "$VPS_PASS" | sudo -S cp -r "$REPO_DIR/apps/web/dist"/* /var/www/pilah-sampah-cerdas/frontend/dist/

            echo "=== 5. Fixing Permissions & Reloading Nginx ==="
            echo "$VPS_PASS" | sudo -S rm -f /etc/nginx/sites-enabled/pilah-sampah-cerdas 2>/dev/null || true
            echo "$VPS_PASS" | sudo -S chown -R www-data:www-data /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist 2>/dev/null || echo "$VPS_PASS" | sudo -S chown -R $USER:$USER /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist
            echo "$VPS_PASS" | sudo -S chmod -R 755 /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist
            echo "$VPS_PASS" | sudo -S systemctl restart nginx || echo "$VPS_PASS" | sudo -S systemctl reload nginx || true

            echo "=== 6. Verification & Status ==="
            test -f /var/www/html/index.html && echo "Deployment verified: /var/www/html/index.html exists"
            $PM2_BIN status || true
          EOF
