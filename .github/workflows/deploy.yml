name: BERSEKA CI/CD — Production Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scratch/**'
      - '.agent/**'
      - '.gitignore'
      - 'mobile/**'
  pull_request:
    branches:
      - main
      - staging
      - development
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scratch/**'
      - '.agent/**'
      - '.gitignore'
      - 'mobile/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate TypeScript & Code Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci --prefer-offline 2>/dev/null || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Type Check Backend API (apps/api)
        run: cd apps/api && npx tsc --noEmit

      - name: Type Check Web Dashboard (apps/web)
        run: cd apps/web && npx tsc --noEmit

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci --prefer-offline 2>/dev/null || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build Web Frontend on GitHub Runner
        run: |
          cd apps/web
          VITE_API_BASE_URL=/api/v1 npm run build
          tar -czf ../../web-dist.tar.gz -C dist .

      - name: Install sshpass
        run: |
          if ! command -v sshpass &> /dev/null; then
            sudo apt-get install -y --no-install-recommends sshpass 2>/dev/null || (sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sshpass)
          fi

      - name: Transfer Web Dist Artifact to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o PreferredAuthentications=password -o PubkeyAuthentication=no web-dist.tar.gz "$VPS_USER@$VPS_HOST:/tmp/web-dist.tar.gz"

      - name: Update Backend & Deploy Web on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" ssh -T -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no "$VPS_USER@$VPS_HOST" "VPS_PASS='$VPS_PASS' bash -s" << 'EOF'
            set -e
            NODE_BIN_DIR=$(ls -d ~/.nvm/versions/node/v* 2>/dev/null | tail -n 1)/bin
            export PATH=$PATH:/usr/local/bin:$NODE_BIN_DIR
            PM2_BIN="$NODE_BIN_DIR/pm2"
            if ! command -v "$PM2_BIN" &> /dev/null; then PM2_BIN="pm2"; fi
            
            echo "=== 1. Pulling Latest Code from Git ==="
            if [ -d ~/Pilah-Sampah-Cerdas-new ]; then REPO_DIR=~/Pilah-Sampah-Cerdas-new; else REPO_DIR=~/Pilah-Sampah-Cerdas; fi
            cd "$REPO_DIR" || { echo "Directory not found"; exit 1; }
            
            # Backup existing .env if present before git reset
            if [ -f "$REPO_DIR/apps/api/.env" ]; then
              cp "$REPO_DIR/apps/api/.env" /tmp/apps_api_env_backup 2>/dev/null || true
            elif [ -f "$REPO_DIR/.env" ]; then
              cp "$REPO_DIR/.env" /tmp/apps_api_env_backup 2>/dev/null || true
            fi

            # Fix ownership so non-root git can write to .git/objects and files
            echo "$VPS_PASS" | sudo -S chown -R $(whoami):$(whoami) "$REPO_DIR" 2>/dev/null || true

            # Clean workspace to prevent local modifications from blocking fetch/reset
            git checkout -f 2>/dev/null || true
            git clean -fd 2>/dev/null || true

            # Force IPv4 resolution and add retries for git fetch to handle VPS network glitches
            git config extra.http.ipresolve 4 2>/dev/null || true
            FETCH_SUCCESS=false
            for i in 1 2 3; do
              if git fetch --depth=1 origin main; then
                FETCH_SUCCESS=true
                break
              fi
              sleep 3
            done

            if [ "$FETCH_SUCCESS" != "true" ]; then
              echo "ERROR: git fetch origin main failed on VPS!"
              exit 1
            fi

            git reset --hard FETCH_HEAD
            git clean -fd 2>/dev/null || true
            echo "Current VPS HEAD: $(git log -1 --oneline)"

            # Restore or create .env for apps/api
            if [ -f /tmp/apps_api_env_backup ]; then
              cp /tmp/apps_api_env_backup "$REPO_DIR/apps/api/.env"
              cp /tmp/apps_api_env_backup "$REPO_DIR/.env"
            fi

            if [ ! -f "$REPO_DIR/apps/api/.env" ]; then
              echo "Recreating production .env for backend on VPS..."
              echo "DATABASE_URL=postgresql://psc_user:psc_password@localhost:5432/psc_db" > "$REPO_DIR/apps/api/.env"
              echo "REDIS_URL=redis://localhost:6379" >> "$REPO_DIR/apps/api/.env"
              echo "JWT_SECRET=ganti_ini_dengan_string_random_minimal_32_karakter" >> "$REPO_DIR/apps/api/.env"
              echo "JWT_EXPIRES_IN=24h" >> "$REPO_DIR/apps/api/.env"
              echo "PORT=3000" >> "$REPO_DIR/apps/api/.env"
              echo "NODE_ENV=production" >> "$REPO_DIR/apps/api/.env"
              echo "FRONTEND_URL=https://berseka.id" >> "$REPO_DIR/apps/api/.env"
              echo "GOOGLE_APPLICATION_CREDENTIALS=./firebase-service-account.json" >> "$REPO_DIR/apps/api/.env"
              echo "AI_VENDOR_PROVIDER=VENDOR" >> "$REPO_DIR/apps/api/.env"
              echo "AI_VENDOR_ENDPOINT=http://localhost:8000/predict" >> "$REPO_DIR/apps/api/.env"
              cp "$REPO_DIR/apps/api/.env" "$REPO_DIR/.env" 2>/dev/null || true
            fi

            export DATABASE_URL="postgresql://psc_user:psc_password@localhost:5432/psc_db"

            echo "=== 2. Updating Backend (apps/api) ==="
            cd "$REPO_DIR"
            npm install --silent --legacy-peer-deps --prefer-offline 2>/dev/null || true
            npx prisma generate --schema=apps/api/prisma/schema.prisma 2>/dev/null || true
            cd "$REPO_DIR/apps/api"
            npx prisma generate
            if [ -d "$REPO_DIR/apps/api/node_modules" ] && [ -d "$REPO_DIR/node_modules/@prisma" ]; then
              mkdir -p "$REPO_DIR/apps/api/node_modules/@prisma" "$REPO_DIR/apps/api/node_modules/.prisma"
              cp -r "$REPO_DIR/node_modules/@prisma/." "$REPO_DIR/apps/api/node_modules/@prisma/" 2>/dev/null || true
              cp -r "$REPO_DIR/node_modules/.prisma/." "$REPO_DIR/apps/api/node_modules/.prisma/" 2>/dev/null || true
            fi
            echo "Executing Prisma migrations & schema synchronization..."
            npx prisma migrate deploy || true
            npx tsx scripts/ensure-schema.ts || true
            npx prisma db push --skip-generate --accept-data-loss || true

            # Sinkronisasi beban SKS mahasiswa (hanya berjalan saat RUN_SKS_SYNC diaktifkan)
            if [ "${RUN_SKS_SYNC:-false}" = "true" ]; then
              echo "=== 2.5. Synchronizing Student SKS Data ==="
              FORCE_ALLOW_VPS_MUTATION=I_UNDERSTAND_THE_RISKS_OVERWRITE_VPS npx tsx scripts/sync-student-sks.ts --commit 2>/dev/null || echo "Sync SKS failed or skipped, continuing..."
            fi

            NODE_OPTIONS="--max-old-space-size=4096" npm run build

            echo "=== 3. Reloading PM2 Backend ==="
            $PM2_BIN reload psc-backend --update-env 2>/dev/null || \
            $PM2_BIN restart psc-backend --update-env 2>/dev/null || \
            $PM2_BIN restart all --update-env 2>/dev/null || \
            $PM2_BIN start dist/index.js --name psc-backend --cwd "$REPO_DIR/apps/api"
            $PM2_BIN save || true
            sleep 1
            $PM2_BIN status psc-backend

            echo "=== 4. Deploying Frontend Web to Nginx ==="
            echo "Unpacking pre-built frontend artifact on VPS..."
            cd "$REPO_DIR/apps/web"
            echo "$VPS_PASS" | sudo -S rm -rf "$REPO_DIR/apps/web/dist" 2>/dev/null || rm -rf "$REPO_DIR/apps/web/dist" 2>/dev/null || true
            mkdir -p "$REPO_DIR/apps/web/dist"
            if [ -f /tmp/web-dist.tar.gz ]; then
              tar -xzf /tmp/web-dist.tar.gz -C "$REPO_DIR/apps/web/dist"
              rm -f /tmp/web-dist.tar.gz
            else
              echo "Warning: /tmp/web-dist.tar.gz not found, using existing dist if present"
            fi
            test -f "$REPO_DIR/apps/web/dist/index.html" || { echo "ERROR: Frontend dist/index.html missing on VPS"; exit 1; }

            # Backup APK dari semua lokasi yang mungkin sebelum rm -rf
            APK_NAME="berseka-release-arm64-v8a.apk"
            APK_TMP="/tmp/$APK_NAME"
            if [ -f "/var/www/html/downloads/$APK_NAME" ]; then
              cp "/var/www/html/downloads/$APK_NAME" "$APK_TMP"
              echo "APK backed up from /var/www/html/downloads/"
            elif [ -f "/var/www/pilah-sampah-cerdas/frontend/dist/downloads/$APK_NAME" ]; then
              cp "/var/www/pilah-sampah-cerdas/frontend/dist/downloads/$APK_NAME" "$APK_TMP"
              echo "APK backed up from /var/www/pilah-sampah-cerdas/frontend/dist/downloads/"
            elif [ -f "$REPO_DIR/apps/api/uploads/$APK_NAME" ]; then
              cp "$REPO_DIR/apps/api/uploads/$APK_NAME" "$APK_TMP"
              echo "APK backed up from apps/api/uploads/"
            fi

            TARGET_DIRS=("/var/www/html" "/var/www/pilah-sampah-cerdas/frontend/dist")
            for d in "${TARGET_DIRS[@]}"; do
              echo "$VPS_PASS" | sudo -S mkdir -p "$d" 2>/dev/null || true
              if [ -d "$d" ]; then
                echo "Copying built frontend to $d..."
                echo "$VPS_PASS" | sudo -S rm -rf "$d"/assets "$d"/index.html 2>/dev/null || true
                echo "$VPS_PASS" | sudo -S cp -r "$REPO_DIR/apps/web/dist"/* "$d"/
                if [ -f "$APK_TMP" ]; then
                  echo "$VPS_PASS" | sudo -S mkdir -p "$d/downloads" 2>/dev/null || true
                  echo "$VPS_PASS" | sudo -S cp "$APK_TMP" "$d/downloads/$APK_NAME" 2>/dev/null || true
                fi
                echo "$VPS_PASS" | sudo -S chown -R www-data:www-data "$d" 2>/dev/null || true
                echo "$VPS_PASS" | sudo -S chmod -R 755 "$d" 2>/dev/null || true
              fi
            done

            if [ -f "$APK_TMP" ]; then
              mkdir -p "$REPO_DIR/apps/api/uploads"
              cp "$APK_TMP" "$REPO_DIR/apps/api/uploads/$APK_NAME" 2>/dev/null || true
              rm -f "$APK_TMP"
            fi

            test -f /var/www/html/index.html || { echo "Frontend missing index.html"; exit 1; }

            echo "=== 5. Fixing Permissions & Reloading Nginx ==="
            echo "$VPS_PASS" | sudo -S systemctl reload nginx || echo "$VPS_PASS" | sudo -S systemctl restart nginx || true

            echo "=== 6. Health Check & Verification ==="
            echo "Waiting for backend initialization..."
            HEALTHY=false
            for attempt in {1..15}; do
              if curl -fsS http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3000/api/dashboard/stats >/dev/null 2>&1; then
                echo "Backend healthy on attempt $attempt"
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Backend health check failed on production VPS! Dumping PM2 logs:"
              $PM2_BIN logs --lines 50 --nostream 2>/dev/null || pm2 logs --lines 50 --nostream 2>/dev/null || true
              exit 1
            fi
            echo "Production deployment successfully completed!"
          EOF
