name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Execute Remote Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" ssh -T -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o PreferredAuthentications=password -o PubkeyAuthentication=no "$VPS_USER@$VPS_HOST" "VPS_PASS='$VPS_PASS' bash -s" << 'EOF'
            export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            echo "=== 1. Pulling Latest Code from Git ==="
            cd ~/Pilah-Sampah-Cerdas
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2. Resetting Database & Seeding Real Data (apps/api) ==="
            cd ~/Pilah-Sampah-Cerdas/apps/api
            npm install --silent
            npx prisma generate
            npx prisma db push --force-reset --skip-generate
            npx prisma db seed
            npx tsx scripts/seed-official-coblong-officials.ts || true
            npx tsx scripts/seed-rt-rw-all.ts || true
            npx tsx scripts/seed-dpl-real.ts || true
            npx tsx scripts/seed-mhs-demo.ts || true
            npm run build

            echo "=== 3. Restarting PM2 Backend ==="
            ~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin/pm2 restart psc-backend || pm2 restart all || true

            echo "=== 4. Building Frontend Web (apps/web) ==="
            cd ~/Pilah-Sampah-Cerdas/apps/web
            npm install --silent
            npm run build

            echo "=== 5. Deploying Frontend to Web Root ==="
            echo "$VPS_PASS" | sudo -S mkdir -p /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist
            echo "$VPS_PASS" | sudo -S rm -rf /var/www/html/assets /var/www/pilah-sampah-cerdas/frontend/dist/assets
            echo "$VPS_PASS" | sudo -S cp -r dist/* /var/www/html/
            echo "$VPS_PASS" | sudo -S cp -r dist/* /var/www/pilah-sampah-cerdas/frontend/dist/

            echo "=== 6. PM2 Status ==="
            pm2 status || true
          EOF


