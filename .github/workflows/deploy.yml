name: BERSEKA CI/CD — Production Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scratch/**'
      - '.agent/**'
      - '.gitignore'
      - 'mobile/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Build & Package Frontend Web
        run: |
          cd apps/web
          npm ci --prefer-offline --no-audit 2>/dev/null || npm install --silent --legacy-peer-deps
          npm run build
          test -f dist/index.html || { echo "Build failed: dist/index.html missing"; exit 1; }
          tar -czf dist.tar.gz -C dist .

      - name: Install sshpass
        run: |
          if ! command -v sshpass &> /dev/null; then
            sudo apt-get install -y --no-install-recommends sshpass 2>/dev/null || (sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sshpass)
          fi

      - name: Upload Frontend Archive to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o PreferredAuthentications=password -o PubkeyAuthentication=no "$VPS_USER@$VPS_HOST" "cat > /tmp/frontend-dist.tar.gz" < apps/web/dist.tar.gz

      - name: Update Backend & Deploy Web on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" ssh -T -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o PreferredAuthentications=password -o PubkeyAuthentication=no "$VPS_USER@$VPS_HOST" "VPS_PASS='$VPS_PASS' bash -s" << 'EOF'
            set -e
            NODE_BIN_DIR=$(ls -d ~/.nvm/versions/node/v* 2>/dev/null | tail -n 1)/bin
            export PATH=$PATH:/usr/local/bin:$NODE_BIN_DIR
            PM2_BIN="$NODE_BIN_DIR/pm2"
            if ! command -v "$PM2_BIN" &> /dev/null; then PM2_BIN="pm2"; fi
            
            echo "=== 1. Pulling Latest Code from Git ==="
            if [ -d ~/Pilah-Sampah-Cerdas-new ]; then REPO_DIR=~/Pilah-Sampah-Cerdas-new; else REPO_DIR=~/Pilah-Sampah-Cerdas; fi
            cd "$REPO_DIR" || { echo "Directory not found"; exit 1; }
            git fetch --depth=1 origin main
            git reset --hard origin/main

            echo "=== 2. Updating Backend (apps/api) ==="
            cd "$REPO_DIR"
            npm install --silent --legacy-peer-deps --prefer-offline 2>/dev/null || true
            cd "$REPO_DIR/apps/api"
            rm -rf node_modules/@prisma node_modules/.prisma
            npx prisma generate
            if [ -d "$REPO_DIR/apps/api/node_modules" ]; then
              mkdir -p "$REPO_DIR/apps/api/node_modules/@prisma" "$REPO_DIR/apps/api/node_modules/.prisma"
              cp -r "$REPO_DIR/node_modules/@prisma/"* "$REPO_DIR/apps/api/node_modules/@prisma/" 2>/dev/null || true
              cp -r "$REPO_DIR/node_modules/.prisma/"* "$REPO_DIR/apps/api/node_modules/.prisma/" 2>/dev/null || true
            fi
            npx prisma migrate deploy || true
            npm run build

            echo "=== 3. Reloading PM2 Backend ==="
            $PM2_BIN reload psc-backend 2>/dev/null || $PM2_BIN restart psc-backend 2>/dev/null || $PM2_BIN start dist/index.js --name psc-backend --cwd "$REPO_DIR/apps/api"
            $PM2_BIN save || true
            sleep 1
            $PM2_BIN status psc-backend

            echo "=== 4. Deploying Frontend Web to Nginx ==="
            echo "$VPS_PASS" | sudo -S mkdir -p /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist
            mkdir -p "$REPO_DIR/apps/web/dist"

            if [ -f /tmp/frontend-dist.tar.gz ] && tar -tzf /tmp/frontend-dist.tar.gz &>/dev/null; then
              echo "Extracting frontend archive from GitHub Actions..."
              tar -xzf /tmp/frontend-dist.tar.gz -C "$REPO_DIR/apps/web/dist/"
              echo "$VPS_PASS" | sudo -S rm -rf /var/www/html/* /var/www/pilah-sampah-cerdas/frontend/dist/*
              echo "$VPS_PASS" | sudo -S cp -r "$REPO_DIR/apps/web/dist"/* /var/www/html/
              echo "$VPS_PASS" | sudo -S cp -r "$REPO_DIR/apps/web/dist"/* /var/www/pilah-sampah-cerdas/frontend/dist/
              rm -f /tmp/frontend-dist.tar.gz
            fi

            test -f /var/www/html/index.html || { echo "Frontend missing index.html"; exit 1; }

            echo "=== 5. Fixing Permissions & Reloading Nginx ==="
            echo "$VPS_PASS" | sudo -S chown -R www-data:www-data /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist 2>/dev/null || true
            echo "$VPS_PASS" | sudo -S chmod -R 755 /var/www/html /var/www/pilah-sampah-cerdas/frontend/dist 2>/dev/null || true
            echo "$VPS_PASS" | sudo -S systemctl reload nginx || echo "$VPS_PASS" | sudo -S systemctl restart nginx || true

            echo "=== 6. Verification & Status ==="
            test -f /var/www/html/index.html && echo "Deployment verified: /var/www/html/index.html exists"
          EOF
