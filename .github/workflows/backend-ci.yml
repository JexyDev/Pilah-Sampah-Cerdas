name: Backend CI

on:
  push:
    branches:
      - backend
  pull_request:
    branches:
      - backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: psc_user
          POSTGRES_PASSWORD: psc_password
          POSTGRES_DB: psc_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Prisma Schema
        run: |
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://psc_user:psc_password@localhost:5432/psc_db?schema=public"

      - name: Run Build
        run: npm run build --if-present
