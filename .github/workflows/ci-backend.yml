name: Backend CI/CD

on:
  push:
    branches:
      - backend
  pull_request:
    branches:
      - backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: psc_user
          POSTGRES_PASSWORD: psc_password
          POSTGRES_DB: psc_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Prisma Schema
        run: |
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://psc_user:psc_password@localhost:5432/psc_db?schema=public"

      - name: Run Build
        run: npm run build --if-present

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/backend' && github.event_name == 'push'
    steps:
      - name: Execute SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "Starting Backend Deployment..."
            cd /var/www/pilah-sampah-cerdas/backend
            
            # Tarik perubahan terbaru dari GitHub
            git pull
            
            # Install dependencies jika ada perubahan package.json
            npm install
            
            # Generate Prisma Client
            npx prisma generate
            
            # Build TypeScript ke JavaScript
            npm run build
            
            # Restart layanan dengan PM2 (atau Start jika belum ada)
            pm2 restart psc-backend || pm2 start dist/index.js --name psc-backend
            
            echo "Backend Deployment Completed Successfully!"
