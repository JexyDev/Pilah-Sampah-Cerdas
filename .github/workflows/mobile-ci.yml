name: Mobile CI

on:
  push:
    branches:
      - mobile
      - fix-analyze-and-dummy
      - main
      - master
  pull_request:
    branches:
      - mobile
      - fix-analyze-and-dummy
      - main
      - master

jobs:
  flutter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Code Analysis
        run: flutter analyze --no-fatal-warnings || true

      - name: Run Tests
        run: flutter test

