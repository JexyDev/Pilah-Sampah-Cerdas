name: Mobile CI

on:
  push:
    branches:
      - mobile
  pull_request:
    branches:
      - mobile

jobs:
  flutter-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Code Analysis
        run: flutter analyze --no-fatal-warnings
