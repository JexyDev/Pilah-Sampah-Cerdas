name: Sync Deployment Branches

on:
  push:
    branches:
      - local-dev

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout local-dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all branches
        run: git fetch --all

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Backend
        run: |
          echo "Syncing backend branch..."
          git checkout -B backend origin/backend || git checkout -b backend
          
          # Extract backend from local-dev
          mkdir -p /tmp/local-backend
          git archive origin/local-dev apps/api/ | tar -x -C /tmp/local-backend --strip-components=2
          
          # Sync files (exclude .git and .github)
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/local-backend/ ./
          
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-sync backend with local-dev"
            git push origin backend
          else
            echo "Backend is up to date."
          fi

      - name: Sync Frontend
        run: |
          echo "Syncing frontend branch..."
          git checkout -B frontend origin/frontend || git checkout -b frontend
          
          # Extract frontend from local-dev
          mkdir -p /tmp/local-frontend
          git archive origin/local-dev apps/web/ | tar -x -C /tmp/local-frontend --strip-components=2
          
          # Sync files
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='.env.production' /tmp/local-frontend/ ./
          
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-sync frontend with local-dev"
            git push origin frontend
          else
            echo "Frontend is up to date."
          fi

      - name: Sync Mobile
        run: |
          echo "Syncing mobile branch..."
          git checkout -B mobile origin/mobile || git checkout -b mobile
          
          # Extract mobile from local-dev
          mkdir -p /tmp/local-mobile
          git archive origin/local-dev apps/mobile/ | tar -x -C /tmp/local-mobile --strip-components=2
          
          # Sync files
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/local-mobile/ ./
          
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-sync mobile with local-dev"
            git push origin mobile
          else
            echo "Mobile is up to date."
          fi

