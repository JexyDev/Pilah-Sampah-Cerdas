name: BERSEKA CI/CD — Staging Deployment

on:
  push:
    branches:
      - staging
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scratch/**'
      - '.agent/**'
      - '.gitignore'
      - 'mobile/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate TypeScript & Code Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci --prefer-offline 2>/dev/null || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Type Check Backend API (apps/api)
        run: cd apps/api && npx tsc --noEmit

      - name: Type Check Web Dashboard (apps/web)
        run: cd apps/web && npx tsc --noEmit

  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          if ! command -v sshpass &> /dev/null; then
            sudo apt-get install -y --no-install-recommends sshpass 2>/dev/null || (sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sshpass)
          fi

      - name: Update Backend & Deploy Web on Staging VPS
        env:
          VPS_HOST: ${{ secrets.STAGING_VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.STAGING_VPS_USERNAME || secrets.VPS_USERNAME }}
          VPS_PASS: ${{ secrets.STAGING_VPS_PASSWORD || secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASS" ssh -T -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no "$VPS_USER@$VPS_HOST" "VPS_PASS='$VPS_PASS' bash -s" << 'EOF'
            set -e
            NODE_BIN_DIR=$(ls -d ~/.nvm/versions/node/v* 2>/dev/null | tail -n 1)/bin
            export PATH=$PATH:/usr/local/bin:/usr/bin:$NODE_BIN_DIR
            PM2_BIN="$NODE_BIN_DIR/pm2"
            if ! command -v "$PM2_BIN" &> /dev/null; then PM2_BIN="pm2"; fi

            echo "=== 1. Pulling Latest Code from Git on Staging ==="
            REPO_DIR=/home/maker/Pilah-Sampah-Cerdas-staging
            if [ ! -d "$REPO_DIR" ]; then
              REPO_DIR=/home/maker/Pilah-Sampah-Cerdas-new
            fi
            cd "$REPO_DIR" || { echo "Directory $REPO_DIR not found"; exit 1; }

            # Backup existing .env if present before git reset
            if [ -f "$REPO_DIR/apps/api/.env" ]; then
              cp "$REPO_DIR/apps/api/.env" /tmp/apps_api_env_staging_backup 2>/dev/null || true
            elif [ -f "$REPO_DIR/.env" ]; then
              cp "$REPO_DIR/.env" /tmp/apps_api_env_staging_backup 2>/dev/null || true
            fi

            # Clean workspace to prevent local modifications from blocking fetch/reset
            git checkout -f 2>/dev/null || true
            git clean -fd 2>/dev/null || true

            git config extra.http.ipresolve 4 2>/dev/null || true
            for i in 1 2 3; do
              git fetch --depth=1 origin staging && break || sleep 3
            done || echo "WARNING: git fetch timed out, continuing..."

            git reset --hard origin/staging 2>/dev/null || true
            git clean -fd 2>/dev/null || true

            # Restore or create .env for apps/api
            if [ -f /tmp/apps_api_env_staging_backup ]; then
              cp /tmp/apps_api_env_staging_backup "$REPO_DIR/apps/api/.env"
              cp /tmp/apps_api_env_staging_backup "$REPO_DIR/.env"
            fi

            if [ ! -f "$REPO_DIR/apps/api/.env" ]; then
              echo "Recreating staging .env for backend on VPS..."
              echo "DATABASE_URL=postgresql://psc_user:psc_password@localhost:5432/psc_db" > "$REPO_DIR/apps/api/.env"
              echo "REDIS_URL=redis://localhost:6379" >> "$REPO_DIR/apps/api/.env"
              echo "JWT_SECRET=ganti_ini_dengan_string_random_minimal_32_karakter" >> "$REPO_DIR/apps/api/.env"
              echo "JWT_EXPIRES_IN=24h" >> "$REPO_DIR/apps/api/.env"
              echo "PORT=3000" >> "$REPO_DIR/apps/api/.env"
              echo "NODE_ENV=production" >> "$REPO_DIR/apps/api/.env"
              echo "FRONTEND_URL=https://staging.berseka.id" >> "$REPO_DIR/apps/api/.env"
              echo "GOOGLE_APPLICATION_CREDENTIALS=./firebase-service-account.json" >> "$REPO_DIR/apps/api/.env"
              echo "AI_VENDOR_PROVIDER=VENDOR" >> "$REPO_DIR/apps/api/.env"
              echo "AI_VENDOR_ENDPOINT=http://localhost:8000/predict" >> "$REPO_DIR/apps/api/.env"
              cp "$REPO_DIR/apps/api/.env" "$REPO_DIR/.env" 2>/dev/null || true
            fi

            export DATABASE_URL="postgresql://psc_user:psc_password@localhost:5432/psc_db"

            echo "=== 2. Updating Backend (apps/api) ==="
            cd "$REPO_DIR"
            npm install --silent --legacy-peer-deps --prefer-offline 2>/dev/null || true
            cd "$REPO_DIR/apps/api"
            npx prisma generate
            if [ -d "$REPO_DIR/apps/api/node_modules" ] && [ -d "$REPO_DIR/node_modules/@prisma" ]; then
              mkdir -p "$REPO_DIR/apps/api/node_modules/@prisma" "$REPO_DIR/apps/api/node_modules/.prisma"
              cp -r "$REPO_DIR/node_modules/@prisma/." "$REPO_DIR/apps/api/node_modules/@prisma/" 2>/dev/null || true
              cp -r "$REPO_DIR/node_modules/.prisma/." "$REPO_DIR/apps/api/node_modules/.prisma/" 2>/dev/null || true
            fi
            echo "Executing Prisma migrations & schema synchronization..."
            npx prisma migrate deploy || true
            npx tsx scripts/ensure-schema.ts || true
            npx prisma db push --skip-generate --accept-data-loss || true

            # Sinkronisasi beban SKS mahasiswa (hanya berjalan saat RUN_SKS_SYNC diaktifkan)
            if [ "${RUN_SKS_SYNC:-false}" = "true" ]; then
              echo "=== 2.5. Synchronizing Student SKS Data ==="
              FORCE_ALLOW_VPS_MUTATION=I_UNDERSTAND_THE_RISKS_OVERWRITE_VPS npx tsx scripts/sync-student-sks.ts --commit 2>/dev/null || echo "Sync SKS failed or skipped, continuing..."
            fi

            NODE_OPTIONS="--max-old-space-size=4096" npm run build

            echo "=== 3. Reloading PM2 Backend Staging ==="
            $PM2_BIN restart all --update-env 2>/dev/null || \
            $PM2_BIN restart psc-backend-staging --update-env 2>/dev/null || \
            $PM2_BIN restart psc-backend --update-env 2>/dev/null || \
            $PM2_BIN start dist/index.js --name psc-backend-staging --cwd "$REPO_DIR/apps/api"
            $PM2_BIN save || true
            $PM2_BIN status

            echo "=== 4. Deploying Frontend Web to Nginx ==="
            TARGET_WEB_DIR=/var/www/staging-web/dist
            if [ ! -d "/var/www/staging-web" ]; then
              TARGET_WEB_DIR=/var/www/html
            fi
            mkdir -p "$TARGET_WEB_DIR/downloads"

            echo "Building frontend directly on staging VPS..."
            cd "$REPO_DIR/apps/web"
            echo "$VPS_PASS" | sudo -S rm -rf "$REPO_DIR/apps/web/dist" 2>/dev/null || rm -rf "$REPO_DIR/apps/web/dist" 2>/dev/null || true
            mkdir -p "$REPO_DIR/apps/web/dist"
            npm install --silent --legacy-peer-deps 2>/dev/null || npm install --legacy-peer-deps
            NODE_OPTIONS="--max-old-space-size=4096" VITE_API_BASE_URL=/api/v1 npm run build
            test -f "$REPO_DIR/apps/web/dist/index.html" || { echo "ERROR: Frontend build failed! dist/index.html missing on VPS"; exit 1; }

            APK_NAME="berseka-staging-arm64-v8a.apk"
            if [ -f "$TARGET_WEB_DIR/downloads/$APK_NAME" ]; then
              cp "$TARGET_WEB_DIR/downloads/$APK_NAME" "/tmp/$APK_NAME"
            fi

            echo "$VPS_PASS" | sudo -S rm -rf "$TARGET_WEB_DIR"/assets "$TARGET_WEB_DIR"/index.html 2>/dev/null || true
            cp -r dist/* "$TARGET_WEB_DIR/"

            if [ -f "/tmp/$APK_NAME" ]; then
              cp "/tmp/$APK_NAME" "$TARGET_WEB_DIR/downloads/$APK_NAME"
              rm -f "/tmp/$APK_NAME"
            fi

            test -f "$TARGET_WEB_DIR/index.html" || { echo "Staging frontend missing index.html"; exit 1; }

            echo "=== 5. Reloading Nginx ==="
            sudo systemctl reload nginx || true

            echo "=== 6. Health Check ==="
            echo "Waiting for backend initialization..."
            HEALTHY=false
            for attempt in {1..15}; do
              if curl -fsS http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3000/api/dashboard/stats >/dev/null 2>&1; then
                echo "Backend healthy on attempt $attempt"
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Backend health check failed on staging VPS! Dumping PM2 logs:"
              $PM2_BIN logs --lines 50 --nostream 2>/dev/null || pm2 logs --lines 50 --nostream 2>/dev/null || true
              exit 1
            fi
            echo "Staging deployment successfully completed!"
