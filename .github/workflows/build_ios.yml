name: BERSEKA Mobile — iOS Build Pipeline (macOS Runner)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - profile
          - debug
      sign_ipa:
        description: 'Sign IPA with Apple Certificate (Requires GitHub Secrets)'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/ios'
      - 'mobile'

jobs:
  build-ios:
    name: Build iOS Archive & IPA
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Install Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: 4. Setup CocoaPods & Pod Install
        working-directory: ios
        run: |
          pod repo update
          pod install --repo-update

      # --- CODE SIGNING STEP (Conditional jika secret tersedia) ---
      - name: 5. Import Apple Signing Certificate (Optional)
        if: ${{ inputs.sign_ipa == true || env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'default_build_password' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            # Decode Base64
            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            # Create temporary keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            # Import certificate to keychain
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            # Apply provisioning profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
            echo "Apple Certificate & Profile configured successfully."
          else
            echo "No Certificate provided. Proceeding with unsigned build."
          fi

      # --- BUILD EXECUTION ---
      - name: 6. Build iOS Release (Unsigned / Direct IPA)
        run: |
          BUILD_NUM=${{ github.run_number }}
          if [ "${{ inputs.sign_ipa }}" = "true" ] && [ -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" ]; then
            echo "Building Signed IPA..."
            flutter build ipa --release --build-name=1.0.${BUILD_NUM} --build-number=${BUILD_NUM} --export-options-plist=ios/ExportOptions.plist
          else
            echo "Building Unsigned IPA for testing..."
            flutter build ios --release --no-codesign --build-name=1.0.${BUILD_NUM} --build-number=${BUILD_NUM}
            
            # Package unsigned .app into Payload (.ipa format)
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r -9 BERSEKA-iOS-Unsigned-1.0.${BUILD_NUM}.ipa Payload
            cd ../../..
          fi

      - name: 7. Collect Build Artifacts
        run: |
          mkdir -p output_ios
          if [ -d "build/ios/ipa" ]; then
            cp build/ios/ipa/*.ipa output_ios/ || true
          fi
          if [ -f "build/ios/iphoneos/BERSEKA-iOS-Unsigned-1.0.${{ github.run_number }}.ipa" ]; then
            cp build/ios/iphoneos/*.ipa output_ios/ || true
          fi
          ls -lah output_ios/

      - name: 8. Upload iOS Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: BERSEKA-iOS-Build-Run-${{ github.run_number }}
          path: output_ios/*.ipa
          retention-days: 14
