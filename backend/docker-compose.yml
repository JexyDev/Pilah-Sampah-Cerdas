version: '3.8'

services:
  # 1. Database PostgreSQL (GIS-Ready)
  postgres:
    image: postgres:15-alpine
    container_name: psc-postgres
    restart: always
    environment:
      POSTGRES_USER: psc_user
      POSTGRES_PASSWORD: psc_password
      POSTGRES_DB: psc_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psc_user -d psc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: psc-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
